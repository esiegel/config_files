##### Vim-style copy mode
#
setw -g mode-keys vi

unbind [
bind C-j copy-mode

bind p paste-buffer

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-j send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel

##### Better Vim/Neovim compatibility

# Faster escape key response in Vim
set -sg escape-time 10

# Better colors
set -g default-terminal "tmux-256color"

# Enable truecolor support
set -ga terminal-overrides ",*:RGB"

# Allow Neovim/Vim to control cursor shape
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

# Focus events for Vim/Neovim plugins
set -g focus-events on

# Mouse support works well with Neovim splits, scrolling, resizing
set -g mouse on

##### Vim-like pane navigation

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Optional: resize panes with Vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


##### Splits open in current directory

# Vertical split: side-by-side
bind '"' split-window -h -c "#{pane_current_path}"

# Horizontal split: top/bottom
bind = split-window -v -c "#{pane_current_path}"

##### Window/buffer navigation

bind Space choose-tree -Zw
bind b run-shell "tmux list-buffers | fzf | cut -d: -f1 | xargs -I {} tmux paste-buffer -b {}"

##### Status bar

set -g status off
